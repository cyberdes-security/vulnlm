name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANONYMIZED_TELEMETRY: "False"
  PYTHONDONTWRITEBYTECODE: "1"
  RUN_MODEL_TESTS: "0"

jobs:
  configuration:
    name: Configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Check installer and Compose configuration
        run: |
          bash -n scripts/install.sh
          shellcheck --shell=bash scripts/install.sh
          docker compose config --quiet
          bash scripts/install.sh --check
      - name: Test frontend polling and session handling
        run: node --experimental-vm-modules --test tests/frontend_polling.test.mjs
      - name: Build the app image
        run: docker compose build app

  sqlite:
    name: SQLite and Chromium
    runs-on: ubuntu-24.04
    container: python:3.13-slim-bookworm
    timeout-minutes: 20
    env:
      RUN_BROWSER_TESTS: "1"
      VULNLM_TEST_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run application, documentation and browser tests
        run: python -m pytest -q --junitxml=test-results/junit-sqlite.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit-sqlite
          path: test-results/junit-sqlite.xml
          retention-days: 14
          if-no-files-found: warn

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-24.04
    container: python:3.13-slim-bookworm
    timeout-minutes: 20
    env:
      RUN_BROWSER_TESTS: "0"
      VULNLM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:vulnlm-test@postgres:5432/vulnlm_test
    services:
      postgres:
        image: postgres:15.18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vulnlm-test
          POSTGRES_DB: vulnlm_test
        options: >-
          --health-cmd "pg_isready -U postgres -d vulnlm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run application and documentation tests on PostgreSQL
        run: python -m pytest -q --junitxml=test-results/junit-postgres.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit-postgres
          path: test-results/junit-postgres.xml
          retention-days: 14
          if-no-files-found: warn
